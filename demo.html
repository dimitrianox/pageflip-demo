<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Memories - Transiciones</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    padding:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    padding:20px;
}

.demo{
    background:#222;
    border-radius:12px;
    overflow:hidden;
}

.title{
    text-align:center;
    padding:10px;
    background:#333;
}

.viewer{
    position:relative;
    aspect-ratio:9/16;
    overflow:hidden;
    background:black;
}

.viewer img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#444;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#555;
}

/* -------------------------------- */
/* FADE PREMIUM */
/* -------------------------------- */

.fade img{
    transition:opacity .8s ease;
}

/* -------------------------------- */
/* FADE + ZOOM */
/* -------------------------------- */

.zoom img{
    transition:
        opacity .8s ease,
        transform .8s ease;
}

/* -------------------------------- */
/* SLIDE */
/* -------------------------------- */

.slide img{
    transition:
        opacity .4s ease,
        transform .4s ease;
}

/* -------------------------------- */
/* KEN BURNS */
/* -------------------------------- */

.ken img{
    transition:
        opacity .8s ease;
}

.ken .active{
    animation:kenburns 8s linear forwards;
}

@keyframes kenburns{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}

</style>
</head>
<body>

<h1>Comparador de Transiciones Atlas</h1>

<div class="grid">

<div class="demo">
<div class="title">Fade Premium</div>
<div class="viewer fade" id="fade"></div>
<button onclick="next('fade')">Cambiar</button>
</div>

<div class="demo">
<div class="title">Fade + Zoom</div>
<div class="viewer zoom" id="zoom"></div>
<button onclick="next('zoom')">Cambiar</button>
</div>

<div class="demo">
<div class="title">Slide Horizontal</div>
<div class="viewer slide" id="slide"></div>
<button onclick="next('slide')">Cambiar</button>
</div>

<div class="demo">
<div class="title">Ken Burns</div>
<div class="viewer ken" id="ken"></div>
<button onclick="next('ken')">Cambiar</button>
</div>

</div>

<script>

const photos = [
"https://picsum.photos/id/1015/800/1400",
"https://picsum.photos/id/1018/800/1400",
"https://picsum.photos/id/1025/800/1400",
"https://picsum.photos/id/1035/800/1400"
];

const states = {};

["fade","zoom","slide","ken"].forEach(init);

function init(id){

    const viewer = document.getElementById(id);

    const a = document.createElement("img");
    const b = document.createElement("img");

    a.src = photos[0];
    b.src = photos[1];

    b.style.opacity = 0;

    viewer.appendChild(a);
    viewer.appendChild(b);

    states[id] = {
        index:0,
        front:a,
        back:b
    };
