<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Apple Books Demo</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="viewer">

    <div id="page-back">

        <img
            id="next-image"
            src="img/2.jpg"
            draggable="false">

    </div>

    <div id="page-front">

        <img
            id="current-image"
            src="img/1.jpg"
            draggable="false">

        <div id="page-shadow"></div>

        <div id="page-highlight"></div>

    </div>

</div>

<script src="app.js"></script>

</body>

</html>
